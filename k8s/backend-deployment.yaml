apiVersion: apps/v1
kind: Deployment

metadata:
  name: expense-backend
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: expense-backend

  template:
    metadata:
      labels:
        app: expense-backend

    spec:
      containers:
      - name: expense-backend
        image: chithambu/expense-backend:latest

        ports:
        - containerPort: 8084

        envFrom:
        - secretRef:
            name: expense-secret

<div class="auth-pages animate-fade-in">
    <div class="auth-box shadow-card">
        <div class="auth-header">
            <div class="logo-box">
                <lucide-icon name="indian-rupee" size="32" class="logo-icon"></lucide-icon>
            </div>
            <h1>Forgot Password?</h1>
            <p class="subtitle">
                Enter your email address and we'll send you a password reset link.
            </p>
        </div>

        <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" class="auth-form mt-6">
            <div class="form-group">
                <label for="email">
                    <lucide-icon name="mail" size="16"></lucide-icon>
                    Email Address
                </label>
                <div class="input-wrapper">
                    <input type="email" id="email" [(ngModel)]="email" name="email" required
                        placeholder="name@example.com" class="form-input" #emailInput="ngModel">
                </div>
                @if (emailInput.invalid && emailInput.touched) {
                <span class="error-text">Valid email is required</span>
                }
            </div>

            @if (message()) {
            <div class="alert mt-4" [class.alert-error]="isError()" [class.alert-success]="!isError()">
                <lucide-icon [name]="isError() ? 'alert-circle' : 'check-circle'" size="18"></lucide-icon>
                <span>{{ message() }}</span>
            </div>
            }

            <button type="submit" class="btn btn-primary auth-btn mt-6"
                [disabled]="forgotForm.invalid || isSubmitting()">
                @if (isSubmitting()) {
                <div class="spinner spinner-small"></div>
                <span>Sending...</span>
                } @else {
                <lucide-icon name="send" size="18"></lucide-icon>
                <span>Send Reset Link</span>
                }
            </button>

            <button type="button" class="btn btn-link mt-4 w-full" routerLink="/login">
                <span>Back to Login</span>
            </button>
        </form>

        <div class="auth-footer mt-6">
            <p>Remember your password? <a routerLink="/login" class="auth-link">Login</a></p>
        </div>
    </div>
</div>
